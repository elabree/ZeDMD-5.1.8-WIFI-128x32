; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = S3-N16R8_128x32_wifi_sd_webradio
extra_configs = platformio_override.ini

; ── Gemeinsame Basis ──────────────────────────────────────────────────────────

[base]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.filesystem = littlefs
extra_scripts = pre:scripts/copy_firmware.py
lib_deps =
    thomasfredericks/Bounce2
    https://github.com/ESP32Async/AsyncTCP#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer#v3.7.0
    knolleary/PubSubClient@^2.8
build_flags =
    -DNO_FAST_FUNCTIONS=1
    -DMINIZ_NO_STDIO=1
    -DMINIZ_NO_TIME=1
    -DMINIZ_NO_DEFLATE_APIS=1
    -DMINIZ_NO_ARCHIVE_APIS=1
    -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DARDUINO_EVENT_RUNNING_CORE=0
    -Os
build_unflags = -Og

; ── Standard ESP32 Base ───────────────────────────────────────────────────────

[esp32]
extends = base
board = esp32dev
board_build.partitions = partitions.csv
lib_deps = ${base.lib_deps}
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA#3.0.14
    bitbank2/AnimatedGIF@^2.1.1

; ── ESP32-S3 Base ─────────────────────────────────────────────────────────────

[esp32s3]
extends = base
board = esp32-s3-wroom-1-n16r8
board_build.partitions = partitions_16MB.csv
build_flags = ${base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
monitor_speed = 115200
lib_deps = ${base.lib_deps}
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA#3.0.14
    bitbank2/AnimatedGIF@^2.1.1
    adafruit/Adafruit GFX Library@^1.11.11

; ── Lilygo Base ───────────────────────────────────────────────────────────────

[lilygo]
extends = base
board = lilygo-t-display-s3
board_build.partitions = partitions_lily.csv
lib_deps = ${base.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/AnimatedGIF@^2.1.1

; ── Standard ESP32 Environments ───────────────────────────────────────────────

[env:128x32]
extends = esp32
build_flags = ${esp32.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8

[env:256x64]
extends = esp32
build_flags = ${esp32.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=5
    -DZEDMD_HD=1

[env:128x64]
extends = esp32
build_flags = ${esp32.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=7
    -DZEDMD_HD_HALF=1

[env:128x32_wifi_sd]
extends = esp32
build_flags = ${esp32.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8
    -DZEDMD_WIFI=1

; ── ESP32-S3 Environments ─────────────────────────────────────────────────────

[env:S3-N16R8_128x32]
extends = esp32s3
build_flags = ${esp32s3.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8

[env:S3-N16R8_128x32_wifi_sd]
extends = esp32s3
build_flags = ${esp32s3.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8
    -DZEDMD_WIFI=1

[env:S3-N16R8_128x32_wifi_sd_webradio]
extends = esp32s3
extra_scripts =
    pre:scripts/copy_firmware.py
    pre:scripts/patch_audio_lib.py
build_flags = ${esp32s3.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8
    -DZEDMD_WIFI=1
    -DWEBRADIO_ENABLED=1
    -DRADIO_I2S_BCLK=9
    -DRADIO_I2S_LRC=14
    -DRADIO_I2S_DOUT=21
lib_deps = ${esp32s3.lib_deps}
    esphome/ESP32-audioI2S@^2.3.0
    bblanchon/ArduinoJson@^6.21.5


[env:S3-N16R8_256x64]
extends = esp32s3
build_flags = ${esp32s3.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8
    -DZEDMD_HD=1

[env:S3-N16R8_128x64]
extends = esp32s3
build_flags = ${esp32s3.build_flags}
    -DDISPLAY_LED_MATRIX=1
    -DPIXEL_COLOR_DEPTH_BITS=8
    -DZEDMD_HD_HALF=1
; ── Lilygo Environments ───────────────────────────────────────────────────────

[env:LilygoS3Amoled_128x32]
extends = lilygo
build_flags = ${lilygo.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISPLAY_RM67162_AMOLED=1

[env:LilygoS3Amoled_128x32_wifi]
extends = lilygo
build_flags = ${lilygo.build_flags}
    -DBOARD_HAS_PSRAM
    -DZEDMD_WIFI=1
    -UARDUINO_USB_CDC_ON_BOOT
    ;-DARDUINO_USB_CDC_ON_BOOT=1 ;//Leave this for debugging
    -DDISPLAY_RM67162_AMOLED=1