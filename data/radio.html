<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>ZeDMD Radio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
    }
    header {
      width: 100%;
      background: #1e1e1e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #333;
    }
    header a { color: #888; text-decoration: none; font-size: 0.85em; }
    header h1 { font-size: 1.1em; color: #fff; }

    .container { width: 100%; max-width: 620px; padding: 16px; }

    /* Now Playing */
    .now-playing {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .np-icon {
      width: 48px; height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .np-icon-placeholder {
      width: 48px; height: 48px;
      border-radius: 6px;
      background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .np-info { flex: 1; min-width: 0; }
    .np-station { font-weight: bold; font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-track { font-size: 0.82em; color: #aaa; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-status { font-size: 0.75em; margin-top: 4px; }
    .np-status.live { color: #f44; }
    .np-status.stopped { color: #666; }

    /* Controls */
    .controls {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    .vol-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .vol-row label { font-size: 0.85em; color: #aaa; white-space: nowrap; }
    .vol-row input[type=range] { flex: 1; accent-color: #e64; }
    .display-row {
      display: flex; align-items: center; gap: 10px;
    }
    .display-row label { font-size: 0.85em; color: #aaa; }
    .toggle-btn {
      padding: 5px 14px;
      border: none; border-radius: 16px;
      font-size: 0.8em; cursor: pointer;
      background: #333; color: #ccc;
      transition: background 0.2s;
    }
    .toggle-btn.active { background: #e64; color: #fff; }
    .stop-btn {
      padding: 7px 18px;
      background: #c33; color: #fff;
      border: none; border-radius: 20px;
      font-size: 0.85em; cursor: pointer;
      margin-left: auto;
    }
    .stop-btn:disabled { background: #444; color: #888; cursor: default; }

    /* Section headings */
    .section-title {
      font-size: 0.78em;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 14px 0 8px;
    }

    /* Presets */
    .preset-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .preset-item {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 9px 12px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .preset-item:hover { background: #262626; }
    .preset-item.playing { border-left: 3px solid #e64; }
    .preset-logo {
      width: 32px; height: 32px;
      border-radius: 4px;
      object-fit: cover;
      background: #2a2a2a;
      flex-shrink: 0;
    }
    .preset-logo-ph {
      width: 32px; height: 32px;
      border-radius: 4px;
      background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .preset-name { flex: 1; font-size: 0.9em; }
    .preset-del {
      background: none; border: none;
      color: #555; font-size: 1.1em;
      cursor: pointer; padding: 4px 6px;
      border-radius: 4px; transition: color 0.15s;
    }
    .preset-del:hover { color: #e44; }
    .preset-empty { color: #555; font-size: 0.85em; padding: 8px 0; }

    /* Suche */
    .search-bar {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 6px;
    }
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .search-row input {
      flex: 1;
      background: #2a2a2a; border: 1px solid #444;
      color: #e0e0e0; border-radius: 6px;
      padding: 7px 10px; font-size: 0.9em;
      min-width: 0;
    }
    .search-row input:focus { outline: none; border-color: #e64; }
    .btn {
      padding: 7px 14px;
      background: #e64; color: #fff;
      border: none; border-radius: 6px;
      font-size: 0.85em; cursor: pointer;
      white-space: nowrap;
    }
    .btn:disabled { background: #444; color: #888; cursor: default; }
    .btn-sec {
      background: #333; color: #ccc;
    }
    .search-hint { font-size: 0.75em; color: #666; margin-bottom: 8px; }

    /* Suchergebnisse */
    .result-list { display: flex; flex-direction: column; gap: 5px; max-height: 340px; overflow-y: auto; }
    .result-item {
      background: #252525;
      border-radius: 7px;
      padding: 8px 10px;
      display: flex; align-items: center; gap: 9px;
    }
    .result-logo {
      width: 30px; height: 30px;
      border-radius: 4px; object-fit: cover;
      background: #2a2a2a; flex-shrink: 0;
    }
    .result-logo-ph {
      width: 30px; height: 30px;
      border-radius: 4px; background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-name { font-size: 0.88em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-tags { font-size: 0.72em; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .result-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .result-actions button {
      padding: 4px 10px;
      border: none; border-radius: 5px;
      font-size: 0.78em; cursor: pointer;
    }
    .btn-play-result { background: #e64; color: #fff; }
    .btn-save-result { background: #333; color: #ccc; }
    .btn-save-result:disabled { background: #222; color: #555; cursor: default; }

    .loading { color: #888; font-size: 0.85em; padding: 10px 0; text-align: center; }
    .error-msg { color: #e44; font-size: 0.82em; padding: 6px 0; }
  </style>
</head>
<body>
<header>
  <a href="/">&#8592; ZeDMD</a>
  <h1>&#127925; Webradio</h1>
</header>

<div class="container">

  <!-- Now Playing -->
  <div class="section-title">Jetzt l&auml;uft</div>
  <div class="now-playing" id="nowPlaying">
    <div class="np-icon-placeholder" id="npIconPh">&#127925;</div>
    <img id="npIcon" class="np-icon" src="" alt="" style="display:none" onerror="this.style.display='none';document.getElementById('npIconPh').style.display='flex'">
    <div class="np-info">
      <div class="np-station" id="npStation">Kein Sender</div>
      <div class="np-track" id="npTrack"></div>
      <div class="np-status stopped" id="npStatus">&#9724; Gestoppt</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="display-row">
      <label>Display-Anzeige</label>
      <button class="toggle-btn" id="displayToggle" onclick="toggleDisplay()">10s anzeigen</button>
      <button class="stop-btn" id="stopBtn" onclick="stopRadio()" disabled>&#9632; Stop</button>
    </div>
  </div>

  <!-- Presets -->
  <div class="section-title">Gespeicherte Sender</div>
  <div class="preset-list" id="presetList">
    <div class="preset-empty">Noch keine Sender gespeichert.</div>
  </div>

  <!-- Manuell -->
  <div class="section-title">URL direkt eingeben</div>
  <div class="search-bar" style="margin-bottom:14px">
    <div class="search-row">
      <input type="text" id="manualName" placeholder="Sendername" maxlength="60">
    </div>
    <div class="search-row" style="margin-top:6px">
      <input type="text" id="manualUrl" placeholder="Stream-URL (http://...)" maxlength="255">
    </div>
    <div class="search-row" style="margin-top:8px; justify-content:flex-end">
      <button class="btn btn-sec" onclick="playManualUrl()">&#9654; Testen</button>
      <button class="btn" style="margin-left:8px" onclick="saveManualPreset()">+ Speichern</button>
    </div>
  </div>

  <!-- Suche -->
  <div class="section-title">Sender suchen</div>
  <div class="search-bar">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Suchbegriff (z.B. NDR, Radio FFN ...)" maxlength="60">
      <button class="btn" onclick="searchStations()">Suchen</button>
      <button class="btn btn-sec" onclick="loadNiedersachsen()">Niedersachsen</button>
    </div>
    <div class="search-hint">Quelle: <a href="https://www.radio-browser.info" target="_blank" style="color:#666">radio-browser.info</a></div>
    <div id="searchStatus" class="loading" style="display:none">Lade...</div>
    <div id="searchError" class="error-msg" style="display:none"></div>
    <div class="result-list" id="resultList"></div>
  </div>

</div>

<script>
  let currentPlaying = null;
  let displayActive = false;
  let presets = [];

  // Status pollen

  async function fetchStatus() {
    try {
      const r = await fetch('/radio_status');
      if (!r.ok) return;
      const d = await r.json();
      updateUI(d);
    } catch(e) {}
  }

  function updateUI(d) {
    const playing = d.playing;
    document.getElementById('stopBtn').disabled = !playing;

    const st = document.getElementById('npStatus');
    if (playing) {
      st.textContent = '● LIVE';
      st.className = 'np-status live';
    } else {
      st.textContent = '■ Gestoppt';
      st.className = 'np-status stopped';
    }

    const station = d.station || (playing ? 'Unbekannt' : 'Kein Sender');
    document.getElementById('npStation').textContent = station;
    document.getElementById('npTrack').textContent = d.title || '';

    // Icon: zuerst aus radio_status (server-seitig), Fallback auf Preset-Array
    const iconEl = document.getElementById('npIcon');
    const iconPh = document.getElementById('npIconPh');
    let icon = d.icon || '';
    if (!icon && d.preset >= 0 && d.preset < presets.length) {
      icon = presets[d.preset].icon || '';
    }
    if (icon) {
      iconEl.src = icon;
      iconEl.style.display = 'block';
      iconPh.style.display = 'none';
    } else {
      iconEl.style.display = 'none';
      iconPh.style.display = 'flex';
    }

    if (d.displayActive !== undefined) {
      displayActive = d.displayActive;
      const btn = document.getElementById('displayToggle');
      btn.textContent = displayActive ? 'aktiv...' : '10s anzeigen';
      btn.className = displayActive ? 'toggle-btn active' : 'toggle-btn';
    }

    currentPlaying = (playing && d.preset >= 0) ? d.preset : null;
    refreshPresetHighlight();
  }

  // Playback

  async function playPreset(idx) {
    const p = presets[idx];
    if (!p) return;
    const fd = new FormData();
    fd.append('url', p.url);
    fd.append('preset', idx);
    await fetch('/radio_play', { method: 'POST', body: fd });
    setTimeout(fetchStatus, 600);
  }

  async function playUrl(url, name, icon) {
    const fd = new FormData();
    fd.append('url', url);
    fd.append('preset', -1);
    document.getElementById('npStation').textContent = name || url;
    document.getElementById('npTrack').textContent = '';
    document.getElementById('npStatus').textContent = '▶ Verbinde...';
    document.getElementById('npStatus').className = 'np-status live';
    if (icon) {
      const iconEl = document.getElementById('npIcon');
      iconEl.src = icon;
      iconEl.style.display = 'block';
      document.getElementById('npIconPh').style.display = 'none';
    }
    await fetch('/radio_play', { method: 'POST', body: fd });
    document.getElementById('stopBtn').disabled = false;
    setTimeout(fetchStatus, 1500);
  }

  async function stopRadio() {
    await fetch('/radio_stop', { method: 'POST' });
    currentPlaying = null;
    setTimeout(fetchStatus, 400);
  }


  // Display-Toggle

  async function toggleDisplay() {
    const btn = document.getElementById('displayToggle');
    btn.textContent = 'aktiv...';
    btn.className = 'toggle-btn active';
    await fetch('/radio_display', { method: 'POST' });
  }

  // Presets

  async function loadPresets() {
    try {
      const r = await fetch('/radio_presets');
      presets = await r.json();
    } catch(e) { presets = []; }
    renderPresets();
  }

  function renderPresets() {
    const el = document.getElementById('presetList');
    if (!presets.length) {
      el.innerHTML = '<div class="preset-empty">Noch keine Sender gespeichert.</div>';
      return;
    }
    el.innerHTML = presets.map((p, i) => `
      <div class="preset-item ${currentPlaying === i ? 'playing' : ''}" onclick="playPreset(${i})">
        ${p.icon
          ? `<img class="preset-logo" src="${esc(p.icon)}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
          : ''}
        <div class="preset-logo-ph" style="${p.icon ? 'display:none' : ''}">&#127925;</div>
        <div class="preset-name">${esc(p.name)}</div>
        <button class="preset-del" onclick="event.stopPropagation();deletePreset(${i})" title="L&ouml;schen">&#10005;</button>
      </div>`).join('');
  }

  function refreshPresetHighlight() {
    document.querySelectorAll('.preset-item').forEach((el, i) => {
      el.classList.toggle('playing', i === currentPlaying);
    });
  }

  async function savePreset(name, url, icon) {
    if (presets.length >= 20) {
      alert('Maximal 20 Sender gespeichert. Bitte erst einen löschen.');
      return false;
    }
    const fd = new FormData();
    fd.append('name', name);
    fd.append('url', url);
    fd.append('icon', icon || '');
    const r = await fetch('/radio_save_preset', { method: 'POST', body: fd });
    if (r.ok) await loadPresets();
    return r.ok;
  }

  async function deletePreset(idx) {
    if (!confirm('Sender löschen?')) return;
    const fd = new FormData();
    fd.append('index', idx);
    await fetch('/radio_delete_preset', { method: 'POST', body: fd });
    if (currentPlaying === idx) currentPlaying = null;
    await loadPresets();
  }

  // Suche via radio-browser.info

  async function searchStations() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    await doSearch({ name: q, limit: 80, order: 'votes', hidebroken: 'true', countrycode: 'DE' });
  }

  async function loadNiedersachsen() {
    await doSearch({ state: 'Niedersachsen', countrycode: 'DE', limit: 100, order: 'votes', hidebroken: 'true' });
  }

  async function doSearch(params) {
    const statusEl = document.getElementById('searchStatus');
    const errorEl  = document.getElementById('searchError');
    const listEl   = document.getElementById('resultList');
    statusEl.style.display = 'block';
    errorEl.style.display  = 'none';
    listEl.innerHTML = '';

    const qs = new URLSearchParams(params).toString();
    const apis = [
      'https://de1.api.radio-browser.info',
      'https://nl1.api.radio-browser.info',
      'https://at1.api.radio-browser.info'
    ];

    let data = null;
    for (const base of apis) {
      try {
        const r = await fetch(`${base}/json/stations/search?${qs}`, {
          headers: { 'User-Agent': 'ZeDMD-Radio/1.0' }
        });
        if (r.ok) { data = await r.json(); break; }
      } catch(e) {}
    }

    statusEl.style.display = 'none';
    if (!data) {
      errorEl.textContent = 'Keine Verbindung zur radio-browser.info API.';
      errorEl.style.display = 'block';
      return;
    }

    // Deduplizierung: pro Stream-URL nur den ersten (höchste Votes) behalten
    const seenUrls = new Set();
    data = data.filter(s => {
      const url = normalizeStreamUrl(s.url_resolved || s.url);
      if (!url || seenUrls.has(url)) return false;
      seenUrls.add(url);
      return true;
    });

    if (!data.length) {
      listEl.innerHTML = '<div class="loading">Keine Ergebnisse.</div>';
      return;
    }

    listEl.innerHTML = data.map(s => {
      const url   = normalizeStreamUrl(s.url_resolved || s.url);
      const saved = presets.length >= 20 || presets.some(p => p.url === url);
      const icon  = s.favicon || '';
      const name  = s.name || 'Unbekannt';
      const bitrate = s.bitrate ? s.bitrate + ' kbps' : '';
      const tags  = [bitrate, s.state, s.tags].filter(Boolean).join(' · ').substring(0, 60);
      return `
        <div class="result-item">
          ${icon
            ? `<img class="result-logo" src="${esc(icon)}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`
            : ''}
          <div class="result-logo-ph" style="${icon ? 'display:none' : ''}">&#127925;</div>
          <div class="result-info">
            <div class="result-name">${esc(name)}</div>
            ${tags ? `<div class="result-tags">${esc(tags)}</div>` : ''}
          </div>
          <div class="result-actions">
            <button class="btn-play-result" onclick="playUrl('${esc(url)}','${esc(name)}','${esc(icon)}')">&#9654;</button>
            <button class="btn-save-result" ${saved ? 'disabled title="Bereits gespeichert"' : `onclick="savePreset('${esc(name)}','${esc(url)}','${esc(icon)}')"`}>+</button>
          </div>
        </div>`;
    }).join('');
  }

  // Helpers

  // Bereinigt radio-browser.info URLs: ?ti=m3u / ?ti=pls sind Server-Hints
  // die eine Playlist-Datei statt des direkten Streams liefern → Library hängt.
  function normalizeStreamUrl(url) {
    if (!url) return url;
    try {
      const u = new URL(url);
      if (u.searchParams.has('ti')) {
        u.searchParams.delete('ti');
        url = u.toString().replace(/\?$/, '');
      }
    } catch(e) {}
    return url;
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Manuelle URL

  function playManualUrl() {
    const url  = document.getElementById('manualUrl').value.trim();
    const name = document.getElementById('manualName').value.trim() || url;
    if (!url) return;
    playUrl(url, name, '');
  }

  async function saveManualPreset() {
    const url  = document.getElementById('manualUrl').value.trim();
    const name = document.getElementById('manualName').value.trim() || url;
    if (!url) return;
    const ok = await savePreset(name, url, '');
    if (ok) {
      document.getElementById('manualName').value = '';
      document.getElementById('manualUrl').value  = '';
    }
  }

  // Init

  loadPresets();
  fetchStatus();
  setInterval(fetchStatus, 3000);
</script>
</body>
</html>
